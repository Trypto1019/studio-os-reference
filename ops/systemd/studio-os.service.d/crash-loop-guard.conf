# Incident: a port conflict crash-looped the unit thousands of times over two
# days with no alert, because Restart=always kept "recovering". Now: 5 starts
# inside 60s -> the unit stays failed -> OnFailure sends an alert.
# Recovery: systemctl reset-failed studio-os && systemctl start studio-os
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=5
OnFailure=unit-failure-alert@%n.service
