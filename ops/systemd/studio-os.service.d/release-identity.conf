# Refuse to start a checkout whose source/BUILD_ID drifted (pre), and refuse
# to declare startup successful until the live process serves the expected
# buildId from the expected PID/port/checkout (post). Applies to every start:
# deploys, manual restarts, reboots and Restart=always.
[Service]
ExecStartPre=/usr/bin/node /srv/studio-os/app/ops/verify-service-release.mjs pre
ExecStartPost=/usr/bin/node /srv/studio-os/app/ops/verify-service-release.mjs post $MAINPID
TimeoutStartSec=90
